name: Deploy Backend to AWS EC2 (v2-dev) using Docker

on:
  push:
    branches:
      - v2-dev

# Prevent race conditions: cancel previous deployment when a new push happens
concurrency:
  group: deploy-v2-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }} # Explicitly use the commit that triggered the workflow

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/stone-erp-be:v2-dev
          build-args: |
            CACHE_BUST=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Login to Docker Hub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Pull Latest Image
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/stone-erp-be:v2-dev

            # Stop and remove existing container if it exists
            if sudo docker inspect stone-erp-be-dev > /dev/null 2>&1; then
              echo "Existing container stone-erp-be-dev found. Stopping and removing..."
              sudo docker stop stone-erp-be-dev
              sudo docker rm stone-erp-be-dev
            else
              echo "Container stone-erp-be-dev does not exist. Starting for the first time..."
            fi

            # Run New Container
            sudo docker run \
              --network host \
              --env-file /home/support/envs/.stone.be.dev.env \
              -d \
              --name stone-erp-be-dev \
              --restart unless-stopped \
              ${{ secrets.DOCKERHUB_USERNAME }}/stone-erp-be:v2-dev

            # Run Migrations
            sudo docker exec stone-erp-be-dev pnpm run migrate:all

            # Clean up Old Images
            # sudo docker image prune -a -f
